
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slate — Classroom Whiteboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Kalam:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap');

:root{
  --frame: #20242B;
  --frame-2: #2A2F38;
  --frame-line: #383E4A;
  --frame-text: #E7E7E2;
  --frame-text-dim: #9BA0AC;
  --accent: #4F9277;
  --accent-strong: #3E7C64;
  --accent-soft: rgba(79,146,119,0.18);
  --danger: #C1694F;
  --danger-soft: rgba(193,105,79,0.18);

  --paper: #FBF9F3;
  --paper-ink: #23272F;
  --paper-line: rgba(35,39,47,0.14);
  --paper-panel: #FFFFFF;
  --paper-panel-border: rgba(35,39,47,0.12);

  --chalk-bg: #1E2A24;
  --chalk-ink: #F5F3E7;
  --chalk-line: rgba(245,243,231,0.14);
  --chalk-panel: #24332B;
  --chalk-panel-border: rgba(245,243,231,0.14);

  --font-ui: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-sans: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-hand: 'Kalam', cursive;
  --font-serif: 'Source Serif 4', Georgia, serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family: var(--font-ui);
  background: var(--frame);
  overflow:hidden;
  -webkit-tap-highlight-color: transparent;
  user-select:none;
}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

#app{
  display:flex;
  flex-direction:column;
  height:100vh;
  width:100vw;
}

/* ===== FRAME / TOOLBAR ===== */
.frame-bar{
  background: var(--frame);
  color: var(--frame-text);
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  border-bottom:1px solid var(--frame-line);
  flex-wrap:wrap;
  z-index:20;
  position:relative;
}
.brand{
  display:flex;
  align-items:center;
  gap:8px;
  padding-right:10px;
  margin-right:4px;
  border-right:1px solid var(--frame-line);
  flex-shrink:0;
}
.brand svg{width:22px;height:22px;flex-shrink:0;}
.brand-name{font-weight:600;font-size:15px;letter-spacing:0.2px;color:var(--frame-text);}
.brand-name b{color:var(--accent);font-weight:700;}

.tool-group{
  display:flex;
  align-items:center;
  gap:2px;
  padding:0 6px;
  border-right:1px solid var(--frame-line);
  flex-shrink:0;
}
.tool-group:last-of-type{border-right:none;}

.tbtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  width:34px;height:34px;
  border-radius:9px;
  border:1px solid transparent;
  background:transparent;
  color:var(--frame-text-dim);
  transition:background .12s ease, color .12s ease;
  position:relative;
}
.tbtn svg{width:18px;height:18px;}
.tbtn:hover{background:var(--frame-2); color:var(--frame-text);}
.tbtn.active{background:var(--accent-soft); color:var(--accent);}
.tbtn.wide{width:auto; padding:0 10px; font-size:13px;}
.tbtn:disabled{opacity:.35; cursor:default;}
.tbtn:disabled:hover{background:transparent;color:var(--frame-text-dim);}

.tbtn .kbd{
  position:absolute; bottom:2px; right:3px;
  font-size:8px; color:inherit; opacity:.55;
}

.tt{position:relative;}
.tt::after{
  content:attr(data-tt);
  position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%);
  background:#111319; color:#fff; font-size:11px; padding:5px 8px; border-radius:6px;
  white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .1s ease .15s;
  z-index:50; font-family:var(--font-ui);
}
.tt:hover::after{opacity:1;}

.spacer{flex:1;}

.dropdown{position:relative;}
.dd-menu{
  position:absolute; top:calc(100% + 6px); left:0;
  background:var(--frame-2); border:1px solid var(--frame-line);
  border-radius:10px; padding:6px; display:none; flex-direction:column; gap:2px;
  min-width:168px; box-shadow:0 10px 30px rgba(0,0,0,.35); z-index:60;
}
.dd-menu.open{display:flex;}
.dd-item{
  display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:7px; background:none; border:none;
  color:var(--frame-text); font-size:13px; text-align:left; white-space:nowrap;
}
.dd-item:hover{background:var(--frame);}
.dd-item svg{width:16px;height:16px;flex-shrink:0;color:var(--frame-text-dim);}
.dd-sep{height:1px;background:var(--frame-line); margin:4px 2px;}

.slate-tabs{display:flex;align-items:center;gap:6px;min-height:42px;padding:5px 12px;background:var(--frame);border-bottom:1px solid var(--frame-line);overflow-x:auto;flex-shrink:0}
.slate-tab{border:1px solid var(--frame-line);background:transparent;color:var(--frame-text-dim);border-radius:8px;padding:7px 12px;font:500 12px var(--font-ui);white-space:nowrap}
.slate-tab:hover{background:var(--frame-2);color:var(--frame-text)}
.slate-tab.active{background:var(--accent-soft);border-color:var(--accent);color:#b9e1cf}
.slate-tab[disabled]{cursor:default;opacity:.8}
.room-role{margin-left:auto;font-size:11px;color:var(--frame-text-dim);white-space:nowrap}
.annotate-btn{display:none;border:1px solid #C1694F;background:rgba(193,105,79,.16);color:#f0b09b;border-radius:8px;padding:7px 11px;font:600 12px var(--font-ui);white-space:nowrap}.annotate-btn.visible{display:block}.annotate-btn.active{background:rgba(193,105,79,.35);color:#ffd3c4}
.share-btn{height:30px;border:1px solid var(--accent);background:var(--accent-soft);color:#b9e1cf;border-radius:8px;padding:0 11px;font:600 12px var(--font-ui)}
.share-btn:hover{background:rgba(79,146,119,.3)}
.participant-tools{display:none;align-items:center;gap:6px;padding:0 6px;border-right:1px solid var(--frame-line)}
.participant-tools button{height:32px;border:1px solid transparent;background:transparent;color:var(--frame-text-dim);border-radius:8px;padding:0 10px;font:500 12px var(--font-ui)}
.participant-tools button:hover,.participant-tools button.active{background:var(--accent-soft);color:#b9e1cf}
body.participant-mode #frameBar .tool-group{display:none!important}body.participant-mode #frameBar .share-btn{display:none!important}body.participant-mode #propsBar{display:none!important}body.participant-mode #slateTabs .slate-tab{display:none!important}body.participant-mode #annotateBtn{display:none!important}body.participant-mode #boardWrap .zoom-dock,body.participant-mode #boardWrap .board-toggles{display:none!important}
body.participant-mode #frameBar > *:not(.brand):not(#participantTools):not(#realtimeStatus){display:none!important}
body.participant-mode #frameBar{padding:8px 12px;min-height:48px}
.share-modal{position:fixed;inset:0;background:rgba(8,10,13,.7);display:none;align-items:center;justify-content:center;z-index:100}
.share-modal.open{display:flex}
.share-card{width:min(440px,calc(100vw - 28px));background:var(--frame-2);border:1px solid var(--frame-line);border-radius:16px;padding:20px;color:var(--frame-text);box-shadow:0 20px 70px rgba(0,0,0,.45)}
.share-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.share-head h3{margin:0;font-size:17px}.share-close{border:0;background:none;color:var(--frame-text-dim);font-size:24px;cursor:pointer}
.share-label{display:block;margin:12px 0 5px;color:var(--frame-text-dim);font-size:11px}.share-row{display:flex;gap:7px}.share-input{flex:1;min-width:0;background:var(--frame);border:1px solid var(--frame-line);border-radius:7px;color:var(--frame-text);padding:8px;font-size:12px}.share-copy{border:1px solid var(--frame-line);background:var(--frame);color:var(--frame-text);border-radius:7px;padding:0 10px}.share-copy:hover{border-color:var(--accent);color:#b9e1cf}.qr-wrap{display:flex;justify-content:center;margin:16px 0 4px}.qr-wrap canvas,.qr-wrap img{background:#fff;border-radius:8px;padding:10px;max-width:220px}.share-note{font-size:11px;line-height:1.45;color:var(--frame-text-dim);margin-top:12px}

/* ===== PROPERTIES BAR (row 2) ===== */
.props-bar{
  display:flex; align-items:center; gap:14px;
  padding:7px 14px;
  background:var(--frame-2);
  border-bottom:1px solid var(--frame-line);
  color:var(--frame-text-dim);
  font-size:12px;
  flex-wrap:wrap;
  min-height:20px;
}
.props-group{display:flex; align-items:center; gap:7px;}
.mini-prop-btn{border:1px solid var(--frame-line);background:var(--frame);color:var(--frame-text-dim);border-radius:6px;padding:5px 7px;font-size:11px}.mini-prop-btn:hover{border-color:var(--accent);color:var(--frame-text)}
.props-label{font-size:11px; color:var(--frame-text-dim); letter-spacing:.2px;}
.swatches{display:flex; gap:5px;}
.swatch{
  width:20px;height:20px;border-radius:6px;border:2px solid rgba(255,255,255,.12);
  cursor:pointer; flex-shrink:0; transition:transform .1s ease;
}
.swatch:hover{transform:scale(1.12);}
.swatch.sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.swatch.none{background:
  linear-gradient(to top left, transparent calc(50% - 1px), #C1694F, transparent calc(50% + 1px)),
  repeating-conic-gradient(#3a3f49 0% 25%, #2c303a 0% 50%) 50% / 8px 8px;}
input[type=color].custom-swatch{
  width:20px;height:20px;border-radius:6px;border:2px solid rgba(255,255,255,.12);
  padding:0; background:none; cursor:pointer;
}
.seg{display:flex; background:var(--frame); border-radius:8px; padding:2px; gap:2px;}
.seg button{
  border:none; background:none; color:var(--frame-text-dim); padding:5px 9px; border-radius:6px;
  font-size:12px;
}
.seg button.active{background:var(--accent); color:#0e1512; font-weight:600;}
.props-select{
  background:var(--frame); color:var(--frame-text); border:1px solid var(--frame-line);
  border-radius:7px; padding:5px 8px; font-size:12px;
}
.hint{color:var(--frame-text-dim); font-size:11.5px; opacity:.8;}

.realtime-status{
  display:flex; align-items:center; gap:7px; padding:0 8px 0 10px;
  color:var(--frame-text-dim); font-size:11px; white-space:nowrap;
}
.realtime-status::before{content:''; width:7px; height:7px; border-radius:50%; background:#9BA0AC; box-shadow:0 0 0 3px rgba(155,160,172,.12);}
.realtime-status.connected{color:#A9D9BF;}
.realtime-status.connected::before{background:#65C98D; box-shadow:0 0 0 3px rgba(101,201,141,.14);}
.realtime-status.error{color:#E5A28F;}
.realtime-status.error::before{background:var(--danger); box-shadow:0 0 0 3px var(--danger-soft);}

/* ===== BOARD ===== */
.board-wrap{
  flex:1; position:relative; overflow:hidden;
  background:var(--paper);
  transition:background .25s ease;
}
.board-wrap.theme-chalk{background:var(--chalk-bg);}
#bgLayer{position:absolute; inset:0; pointer-events:none;}
#boardSvg{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none;}

.el-text, .sticky-text, .table-cell{
  outline:none; width:100%; height:100%; cursor:default;
  overflow:hidden; word-wrap:break-word;
}
.el-text, .sticky-text, .table-cell{
  -webkit-user-select:text; user-select:text; pointer-events:auto;
}
.el-text{
  padding:4px 6px; line-height:1.35; background:transparent;
}
.el-text ul,.el-text ol{margin:2px 0 2px 22px;padding:0}.el-text li{padding-left:2px}
.el-text[contenteditable=true], .sticky-text[contenteditable=true], .table-cell[contenteditable=true]{
  cursor:text;
}
.sticky-box{
  width:100%; height:100%; display:flex; flex-direction:column;
  border-radius:3px 14px 3px 14px;
  box-shadow: 2px 6px 14px rgba(0,0,0,.16), inset 0 0 0 1px rgba(0,0,0,.05);
  padding:12px 12px 10px;
}
.sticky-text{
  flex:1; font-family:var(--font-hand); font-size:16px; line-height:1.4; color:#2b2410;
}
.wb-table{
  display:grid; width:100%; height:100%; min-width:0; min-height:0;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}
.wb-table .table-cell{
  border:1.4px solid currentColor; padding:6px 8px; font-size:13px;
  overflow:hidden; min-width:0; min-height:0; line-height:1.25;
}
.el-locked{pointer-events:none;}

.marquee-rect{ fill:rgba(79,146,119,0.10); stroke:var(--accent); stroke-width:1.2; stroke-dasharray:4 3; }
.sel-outline{ fill:none; stroke:var(--accent); stroke-width:1.4; stroke-dasharray:5 4; }
.sel-handle{ fill:#fff; stroke:var(--accent); stroke-width:1.6; }
.sel-handle.rot{ fill:var(--accent); }

/* floating table toolbar */
.table-toolbar{
  position:absolute; display:none; gap:4px; background:var(--frame);
  border:1px solid var(--frame-line); padding:5px; border-radius:9px;
  box-shadow:0 8px 20px rgba(0,0,0,.3); z-index:40;
}
.table-toolbar button{
  width:28px;height:28px; border-radius:6px; border:none; background:var(--frame-2);
  color:var(--frame-text); font-size:14px; display:flex; align-items:center; justify-content:center;
}
.table-toolbar button:hover{background:var(--accent-soft); color:var(--accent);}

/* ===== ZOOM / STATUS ===== */
.zoom-dock{
  position:absolute; left:16px; bottom:16px;
  display:flex; align-items:center; gap:2px;
  background:var(--frame); border:1px solid var(--frame-line);
  border-radius:11px; padding:4px; box-shadow:0 8px 22px rgba(0,0,0,.25);
  z-index:15;
}
.zoom-dock button{
  width:30px;height:30px; border:none; background:none; color:var(--frame-text);
  border-radius:8px; font-size:15px; display:flex; align-items:center; justify-content:center;
}
.zoom-dock button:hover{background:var(--frame-2);}
.zoom-pct{font-size:12px; color:var(--frame-text-dim); width:44px; text-align:center; user-select:none;}

.board-toggles{
  position:absolute; right:16px; bottom:16px;
  display:flex; align-items:center; gap:8px; z-index:15;
}
.pill-btn{
  display:flex; align-items:center; gap:6px;
  background:var(--frame); border:1px solid var(--frame-line); color:var(--frame-text-dim);
  padding:7px 11px; border-radius:20px; font-size:12px; box-shadow:0 8px 22px rgba(0,0,0,.2);
}
.pill-btn:hover{color:var(--frame-text);}
.pill-btn svg{width:14px;height:14px;}

.status-note{
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  background:rgba(32,36,43,.92); color:#fff; font-size:12.5px; padding:8px 14px;
  border-radius:9px; z-index:30; pointer-events:none; opacity:0; transition:opacity .25s ease;
  max-width:60vw; text-align:center;
}
.status-note.show{opacity:1;}

/* cursors */
.tool-select #boardSvg{cursor:default;}
.tool-pan #boardSvg{cursor:grab;}
.tool-pan.panning #boardSvg{cursor:grabbing;}
.tool-pen #boardSvg, .tool-highlighter #boardSvg{cursor:crosshair;}
.tool-eraser #boardSvg{cursor: cell;}
.tool-rect #boardSvg, .tool-ellipse #boardSvg, .tool-diamond #boardSvg, .tool-line #boardSvg, .tool-arrow #boardSvg{cursor:crosshair;}
.tool-text #boardSvg, .tool-sticky #boardSvg, .tool-table #boardSvg{cursor:text;}

.handle-nwse{cursor:nwse-resize;} .handle-nesw{cursor:nesw-resize;}
.handle-ns{cursor:ns-resize;} .handle-ew{cursor:ew-resize;}
.handle-move{cursor:move;}

::-webkit-scrollbar{width:0;height:0;}

@media (max-width: 880px){
  .brand-name{display:none;}
  .hint{display:none;}
}
</style>
</head>
<body>
<div id="app">

  <!-- ===== TOOLBAR ROW 1 ===== -->
  <div class="frame-bar" id="frameBar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="15" rx="3" stroke="#4F9277" stroke-width="1.6"/><path d="M7 19v2M17 19v2" stroke="#4F9277" stroke-width="1.6" stroke-linecap="round"/><path d="M6 9l3.2 4L12 10l4 5" stroke="#E7E7E2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="brand-name"><b>Slate</b></div>
    </div>

    <div class="participant-tools" id="participantTools" aria-label="Participant tools">
      <button type="button" data-participant-tool="select">Select / Edit</button>
      <button type="button" data-participant-tool="text">Text</button>
      <button type="button" data-participant-tool="pen">Draw</button>
      <button type="button" data-participant-tool="highlighter">Highlight</button>
    </div>

    <div class="tool-group">
      <button class="tbtn tt active" data-tool="select" data-tt="Select (V)"><svg viewBox="0 0 24 24" fill="none"><path d="M5 3l14 8-6 1.5L11 19 5 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
      <button class="tbtn tt" data-tool="pan" data-tt="Pan / Hand (H)"><svg viewBox="0 0 24 24" fill="none"><path d="M8 12V6a1.5 1.5 0 013 0v5m0-4a1.5 1.5 0 013 0v4m0-2a1.5 1.5 0 013 0v4m-9-1l-1.8-1.8a1.5 1.5 0 00-2.2 2l3 4.5A5 5 0 0010 21h3a5 5 0 005-5v-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>

    <div class="tool-group">
      <button class="tbtn tt" data-tool="pen" data-tt="Pen (P)"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20l1-4.2L15.5 5.3a1.5 1.5 0 012.1 0l1.1 1.1a1.5 1.5 0 010 2.1L8.2 19 4 20z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
      <button class="tbtn tt" data-tool="highlighter" data-tt="Highlighter (I)"><svg viewBox="0 0 24 24" fill="none"><path d="M6 15l7-9 4 3-8 8-4.5 1.5L6 15z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 18.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="tbtn tt" data-tool="eraser" data-tt="Eraser (E)"><svg viewBox="0 0 24 24" fill="none"><path d="M18 13l-6.5 6.5a2 2 0 01-2.8 0L4 14.8a2 2 0 010-2.8L13 3l7 7-6 6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 20h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>

    <div class="tool-group">
      <button class="tbtn tt" data-tool="text" data-tt="Text (T)"><svg viewBox="0 0 24 24" fill="none"><path d="M5 6h14M12 6v13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      <button class="tbtn tt" data-tool="sticky" data-tt="Sticky note (N)"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v10.5L14.5 20H4V4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14.5 20v-4.5a1 1 0 011-1H20" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>

      <div class="dropdown">
        <button class="tbtn tt" id="shapeBtn" data-tt="Shapes (S)"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="8" height="8" rx="1.4" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="17" r="4.2" stroke="currentColor" stroke-width="1.6"/></svg></button>
        <div class="dd-menu" id="shapeMenu">
          <button class="dd-item" data-shape="rect"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="16" height="12" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>Rectangle</button>
          <button class="dd-item" data-shape="ellipse"><svg viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="12" rx="8" ry="6" stroke="currentColor" stroke-width="1.6"/></svg>Ellipse</button>
          <button class="dd-item" data-shape="diamond"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l9 9-9 9-9-9z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Diamond</button>
        </div>
      </div>

      <button class="tbtn tt" data-tool="line" data-tt="Line (L)"><svg viewBox="0 0 24 24" fill="none"><path d="M5 19L19 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>

<script>
(function(){
"use strict";

/* ===================== STATE ===================== */
const state = {
  elements: [],
  selectedIds: new Set(),
  tool: 'select',
  toolLocked: false,
  view: { x: 0, y: 0, scale: 1 },
  theme: 'paper',
  bgStyle: 'dot',
  defaults: {
    stroke: '#23272F',
    fill: 'none',
    strokeWidth: 4,
    fontFamily: "'Space Grotesk', ui-sans-serif, system-ui, sans-serif",
    fontSize: 18,
    stickyColor: '#F3C55D'
  },
  mode: 'idle',
  current: null,
  clipboard: null,
  editingId: null
};
let annotationMode = false;

const roomState = { main: [], participants: {}, participantMeta: {}, activeSlateId:'main' };
const params = new URLSearchParams(location.search);
const isOwner = (params.get('role') || 'owner').toLowerCase() !== 'participant';
let participantId = null;
let joinOrder = null;
let displayName = params.get('name') || '';

/* ===================== REALTIME ===================== */
const REALTIME_CONFIG = {
  supabaseUrl: 'https://wpklmzmerhwokfvtklnx.supabase.co',
  anonKey: 'sb_publishable_RROBN-EPYL26R3SpwaUBag_f9RLHfWu',
  room: new URLSearchParams(location.search).get('room') || 'slate-classroom'
};
const realtimeStatus = document.getElementById('realtimeStatus');
let realtimeChannel = null;
let realtimeClientId = 'client-' + Math.random().toString(36).slice(2, 10);
let realtimeReady = false;
let applyingRemote = false;

/* 每次 commit 後記錄的「最後一次已同步的元素快照」，用來算 delta */
let lastBroadcastElements = null;

function setRealtimeStatus(kind, message){
  realtimeStatus.className = 'realtime-status' + (kind ? ' '+kind : '');
  realtimeStatus.textContent = message;
}
function sendRealtime(event, payload){
  if(!realtimeChannel || !realtimeReady || applyingRemote) return;
  realtimeChannel.send({type:'broadcast', event, payload:Object.assign({sender:realtimeClientId},payload)}).catch(()=>{});
}

/* ===================== 深拷貝（structuredClone 優先） ===================== */
function clone(o){
  try { return structuredClone(o); }
  catch(e){ return JSON.parse(JSON.stringify(o)); }
}

/* ===================== DELTA 計算與套用 ===================== */
/* delta = { add: [el...], update: [el...], remove: [id...] } */
function computeDelta(prevArr, nextArr){
  const prevMap = new Map((prevArr||[]).map(e=>[e.id,e]));
  const nextMap = new Map((nextArr||[]).map(e=>[e.id,e]));
  const add=[], update=[], remove=[];
  for(const [id,el] of nextMap){
    const p = prevMap.get(id);
    if(!p) add.push(el);
    else if(!shallowEqualEl(p, el)) update.push(el);
  }
  for(const [id] of prevMap){ if(!nextMap.has(id)) remove.push(id); }
  return { add, update, remove };
}
function shallowEqualEl(a, b){
  if(a===b) return true;
  // 快速欄位比對，避免 JSON.stringify 成本
  const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
  for(const k of keys){
    if(k==='points'){
      const pa=a.points||[], pb=b.points||[];
      if(pa.length!==pb.length) return false;
      for(let i=0;i<pa.length;i++){ if(pa[i][0]!==pb[i][0]||pa[i][1]!==pb[i][1]) return false; }
      continue;
    }
    if(k==='cells'){
      const ca=a.cells||[], cb=b.cells||[];
      if(ca.length!==cb.length) return false;
      for(let i=0;i<ca.length;i++){
        const ra=ca[i]||[], rb=cb[i]||[];
        if(ra.length!==rb.length) return false;
        for(let j=0;j<ra.length;j++){ if(ra[j]!==rb[j]) return false; }
      }
      continue;
    }
    if(k==='bindStart'||k==='bindEnd'){
      const x=a[k]||null, y=b[k]||null;
      if(!x!==!y) return false;
      if(x && (x.id!==y.id || x.fx!==y.fx || x.fy!==y.fy)) return false;
      continue;
    }
    if(a[k]!==b[k]) return false;
  }
  return true;
}
function applyDelta(arr, delta){
  const map = new Map((arr||[]).map(e=>[e.id,e]));
  for(const id of delta.remove) map.delete(id);
  for(const el of delta.add) map.set(el.id, clone(el));
  for(const el of delta.update){
    const exist = map.get(el.id);
    if(exist) Object.assign(exist, clone(el));
    else map.set(el.id, clone(el));
  }
  return [...map.values()];
}

/* ===================== 房間同步 ===================== */
function ownerCopy(el){ const c=clone(el); c.ownerSourceId = el.ownerSourceId || el.id; c.id=newId(); return c; }
function snapshotForParticipant(){ return roomState.main.map(ownerCopy); }

function saveActiveSlate(){
  if(roomState.activeSlateId==='main') roomState.main = state.elements;
  else roomState.participants[roomState.activeSlateId] = state.elements;
}

/* owner 的 main 變動 → 只把 delta 套到每個 participant 的 snapshot 上 */
function applyMainDeltaToParticipant(pid, delta){
  const cur = roomState.participants[pid] || [];
  const map = new Map(cur.map(e=>[e.id,e]));
  const srcMap = new Map(cur.filter(e=>e.ownerSourceId).map(e=>[e.ownerSourceId,e]));

  for(const el of delta.add){
    const srcId = el.ownerSourceId || el.id;
    if(srcMap.has(srcId)) continue;
    const cp = ownerCopy(el);
    map.set(cp.id, cp);
  }
  for(const el of delta.update){
    const srcId = el.ownerSourceId || el.id;
    const exist = srcMap.get(srcId);
    if(exist){
      const geo = {x:exist.x,y:exist.y,w:exist.w,h:exist.h,x1:exist.x1,y1:exist.y1,x2:exist.x2,y2:exist.y2};
      Object.assign(exist, clone(el), {id:exist.id, ownerSourceId:srcId});
      for(const k in geo) if(geo[k]!==undefined) exist[k]=geo[k];
    } else {
      const cp = ownerCopy(el);
      map.set(cp.id, cp);
      srcMap.set(srcId, cp);
    }
  }
  for(const id of delta.remove){
    // id 可能是 ownerSourceId 或本地 id
    for(const [localId, e] of [...map]){
      if(e.id===id || e.ownerSourceId===id) map.delete(localId);
    }
  }
  roomState.participants[pid] = [...map.values()];
}

function broadcastActiveSlateDelta(){
  saveActiveSlate();
  if(!lastBroadcastElements){
    lastBroadcastElements = clone(state.elements);
    return;
  }
  const delta = computeDelta(lastBroadcastElements, state.elements);
  if(!delta.add.length && !delta.update.length && !delta.remove.length){
    lastBroadcastElements = clone(state.elements);
    return;
  }
  if(isOwner && roomState.activeSlateId==='main'){
    roomState.main = state.elements;
    for(const pid of Object.keys(roomState.participants)){
      applyMainDeltaToParticipant(pid, delta);
    }
    for(const pid of Object.keys(roomState.participants)){
      sendRealtime('main-delta', {targetParticipantId:pid, slateId:'main', delta});
    }
  } else {
    sendRealtime('participant-delta', {
      targetParticipantId: participantId || roomState.activeSlateId,
      slateId: roomState.activeSlateId,
      delta
    });
  }
  lastBroadcastElements = clone(state.elements);
}

/* 接收 main delta */
function applyOwnerDeltaToParticipant(payload){
  if(isOwner || !payload || payload.targetParticipantId!==participantId) return;
  const cur = roomState.participants[participantId] || [];
  const next = payload.delta ? applyDelta(cur, payload.delta) : (payload.elements || cur);
  roomState.participants[participantId] = next;
  if(roomState.activeSlateId===participantId){
    applyingRemote = true;
    diffRender(next);
    applyingRemote = false;
  }
  lastBroadcastElements=clone(next);
}

/* 接收完整 snapshot（僅在加入時） */
function applySlateSnapshot(payload){
  if(!payload || payload.sender===realtimeClientId) return;
  const target = payload.slateId || payload.targetParticipantId;
  if(target==='main' && isOwner) roomState.main = payload.elements || [];
  else if(target) roomState.participants[target] = payload.elements || [];
  const active = roomState.activeSlateId;
  if(!isOwner && payload.view){
    state.view=clone(payload.view);
    applyView();
  }
  if(target===active || (target===participantId && active===participantId)){
    applyingRemote = true;
    state.elements = target==='main' ? roomState.main : roomState.participants[target];
    fullRender();
    applyingRemote = false;
    lastBroadcastElements = clone(state.elements);
  }
  if(isOwner) renderSlateTabs();
}

function assignParticipant(payload){
  if(isOwner || !payload || payload.targetClientId!==realtimeClientId) return;
  participantId=payload.participantId; joinOrder=payload.joinOrder;
  displayName=displayName||payload.displayName||('Participant '+joinOrder);
  roomState.participants[participantId]=payload.elements||[];
  if(payload.view){ state.view=clone(payload.view); applyView(); }
  activateSlate(participantId);
  realtimeChannel && realtimeChannel.track({joinedAt:Date.now(),role:'participant',clientId:realtimeClientId,participantId,displayName});
  document.getElementById('roomRole').textContent='Participant '+joinOrder+' · Connected';
  sendRealtime('request-main-snapshot',{targetParticipantId:participantId});
}
function handleJoin(payload){
  if(!isOwner || !payload || payload.sender===realtimeClientId) return;
  const existing = Object.keys(roomState.participantMeta).find(p=>roomState.participantMeta[p].clientId===payload.sender);
  const pid = existing || ('p'+(Object.keys(roomState.participantMeta).length+1));
  const order = existing ? roomState.participantMeta[pid].joinOrder : Object.keys(roomState.participantMeta).length+1;
  if(!existing){
    roomState.participantMeta[pid]={clientId:payload.sender,joinOrder:order,displayName:payload.displayName||('Participant '+order)};
    roomState.participants[pid]=snapshotForParticipant();
  }
  sendRealtime('assign-participant',{
    targetClientId:payload.sender, participantId:pid, joinOrder:order,
    displayName:roomState.participantMeta[pid].displayName,
    elements:clone(roomState.participants[pid]), view:clone(state.view)
  });
  renderSlateTabs();
}

async function connectRealtime(){
  const configured = window.supabase && REALTIME_CONFIG.supabaseUrl.startsWith('http') &&
    !REALTIME_CONFIG.supabaseUrl.includes('YOUR-PROJECT') && !REALTIME_CONFIG.anonKey.includes('YOUR_');
  if(!configured){
    setRealtimeStatus('error', '請設定 Realtime');
    toast('請在 HTML 內填入 Supabase URL 與 anon key，或先以單機模式使用。', 4200);
    return;
  }
  try{
    const client = window.supabase.createClient(REALTIME_CONFIG.supabaseUrl, REALTIME_CONFIG.anonKey, {
      auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}
    });
    realtimeChannel = client.channel('slate-room-' + REALTIME_CONFIG.room, {
      config:{broadcast:{self:false}, presence:{key:realtimeClientId}}
    });
    realtimeChannel
      .on('broadcast', {event:'join'}, ({payload})=>handleJoin(payload))
      .on('broadcast', {event:'assign-participant'}, ({payload})=>assignParticipant(payload))
      .on('broadcast', {event:'request-main-snapshot'}, ({payload})=>{
        if(isOwner && payload && payload.targetParticipantId)
          sendRealtime('participant-snapshot',{
            targetParticipantId:payload.targetParticipantId,
            elements:clone(roomState.participants[payload.targetParticipantId]||snapshotForParticipant())
          });
      })
      .on('broadcast', {event:'participant-snapshot'}, ({payload})=>{
        if(payload && (!payload.targetParticipantId || payload.targetParticipantId===participantId))
          applySlateSnapshot(Object.assign({},payload,{slateId:participantId}));
      })
      .on('broadcast', {event:'request-participant-snapshot'}, ({payload})=>{
        if(!isOwner && payload && payload.targetParticipantId===participantId)
          sendRealtime('participant-delta',{
            targetParticipantId:participantId, slateId:participantId,
            elements:clone(state.elements)
          });
      })
      .on('broadcast', {event:'main-delta'}, ({payload})=>{
        if(payload && payload.targetParticipantId===participantId) applyOwnerDeltaToParticipant(payload);
        else if(isOwner && payload && payload.targetParticipantId){
          roomState.participants[payload.targetParticipantId]=payload.elements||[];
          renderSlateTabs();
        }
      })
      .on('broadcast', {event:'participant-delta'}, ({payload})=>{
        if(!payload || !payload.targetParticipantId) return;
        if(!isOwner && payload.targetParticipantId===participantId){
          const cur = roomState.participants[participantId] || [];
          const next = payload.delta ? applyDelta(cur, payload.delta) : (payload.elements||cur);
          roomState.participants[participantId] = next;
          if(roomState.activeSlateId===participantId){
            applyingRemote = true; diffRender(next); applyingRemote = false;
          }
          lastBroadcastElements=clone(next);
          return;
        }
        if(isOwner){
          if(payload.delta){
            const cur = roomState.participants[payload.targetParticipantId] || [];
            roomState.participants[payload.targetParticipantId] = applyDelta(cur, payload.delta);
          } else {
            roomState.participants[payload.targetParticipantId]=payload.elements||[];
          }
          if(roomState.activeSlateId===payload.targetParticipantId){
            applyingRemote = true;
            diffRender(roomState.participants[payload.targetParticipantId]);
            applyingRemote = false;
          }
          renderSlateTabs();
        }
      })
      .on('presence', {event:'sync'}, ()=>{
        if(isOwner){
          const presence=realtimeChannel.presenceState();
          Object.values(presence).flat().forEach(meta=>{
            if(meta.participantId && !roomState.participantMeta[meta.participantId]){
              roomState.participantMeta[meta.participantId]={
                clientId:meta.clientId,
                joinOrder:meta.joinOrder||Object.keys(roomState.participantMeta).length+1,
                displayName:meta.displayName||('Participant '+meta.participantId.slice(1))
              };
              roomState.participants[meta.participantId] ||= [];
              sendRealtime('request-participant-snapshot',{targetParticipantId:meta.participantId});
            }
          });
          renderSlateTabs();
        }
      })
      .on('presence', {event:'leave'}, ({leftPresences})=>{
        if(!isOwner) return;
        (leftPresences||[]).forEach(meta=>{
          const pid=Object.keys(roomState.participantMeta).find(p=>roomState.participantMeta[p].clientId===meta.clientId);
          if(pid){ delete roomState.participantMeta[pid]; delete roomState.participants[pid]; if(roomState.activeSlateId===pid) activateSlate('main'); }
        });
        renderSlateTabs();
      })
      .subscribe(async status=>{
        if(status==='SUBSCRIBED'){
          realtimeReady = true;
          setRealtimeStatus('connected', (isOwner?'Owner':'Participant')+' · '+REALTIME_CONFIG.room);
          document.getElementById('roomRole').textContent=isOwner?'Owner · Connected':'Participant · waiting for assignment';
          await realtimeChannel.track({joinedAt:Date.now(),role:isOwner?'owner':'participant',clientId:realtimeClientId,participantId});
          if(!isOwner) sendRealtime('join',{displayName:displayName||null});
        } else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
          realtimeReady = false; setRealtimeStatus('error', '連線失敗');
        }
      });
  }catch(err){
    realtimeReady = false; setRealtimeStatus('error', '連線失敗');
    toast('Realtime 連線設定有誤，請檢查 Supabase URL 與 anon key。', 4200);
  }
}

const NS = 'http://www.w3.org/2000/svg';
const XHTML = 'http://www.w3.org/1999/xhtml';
function svgEl(tag, attrs){
  const e = document.createElementNS(NS, tag);
  if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

/* ===================== BBOX ===================== */
function getBBox(el){
  if(el.type==='path'){
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for(const p of el.points){ minX=Math.min(minX,p[0]); minY=Math.min(minY,p[1]); maxX=Math.max(maxX,p[0]); maxY=Math.max(maxY,p[1]); }
    const pad = (el.strokeWidth||4)/2 + 2;
    return {x:minX-pad, y:minY-pad, w:(maxX-minX)+pad*2, h:(maxY-minY)+pad*2};
  }
  if(el.type==='shape' && (el.shapeKind==='line' || el.shapeKind==='arrow')){
    const x = Math.min(el.x1,el.x2), y = Math.min(el.y1,el.y2);
    return {x, y, w:Math.abs(el.x2-el.x1)||1, h:Math.abs(el.y2-el.y1)||1};
  }
  return {x:el.x, y:el.y, w:el.w, h:el.h};
}
function contentBBox(){
  if(!state.elements.length) return {x:-400,y:-300,w:800,h:600};
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const el of state.elements){
    const b = getBBox(el);
    minX=Math.min(minX,b.x); minY=Math.min(minY,b.y);
    maxX=Math.max(maxX,b.x+b.w); maxY=Math.max(maxY,b.y+b.h);
  }
  const pad=60;
  return {x:minX-pad, y:minY-pad, w:(maxX-minX)+pad*2, h:(maxY-minY)+pad*2};
}

/* ===================== PATH / SHAPE ===================== */
function smoothPath(pts){
  if(pts.length===0) return '';
  if(pts.length===1) return `M ${pts[0][0]} ${pts[0][1]} L ${pts[0][0]+0.1} ${pts[0][1]+0.1}`;
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2;
    d += ` Q ${pts[i][0]} ${pts[i][1]} ${mx} ${my}`;
  }
  const last = pts[pts.length-1];
  d += ` L ${last[0]} ${last[1]}`;
  return d;
}
function arrowHeadPoints(x1,y1,x2,y2,size){
  size = size || 12;
  const angle = Math.atan2(y2-y1, x2-x1);
  const a1 = angle + Math.PI - Math.PI/7;
  const a2 = angle + Math.PI + Math.PI/7;
  return `${x2},${y2} ${x2+size*Math.cos(a1)},${y2+size*Math.sin(a1)} ${x2+size*Math.cos(a2)},${y2+size*Math.sin(a2)}`;
}
