<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shirley Du · Learning Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ec;--card:#fffdf8;--ink:#14261f;--mute:#5d6b64;--line:#d9d3c2;--accent:#7fa892;--deep:#1d4a3a;--red:#a4123f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a16;--card:#16251f;--ink:#efe9da;--mute:#9db0a6;--line:#2a3d34;--accent:#8fbfa5;--deep:#a3c1ad;--red:#e0466f}}
:root[data-theme="dark"]{--bg:#0f1a16;--card:#16251f;--ink:#efe9da;--mute:#9db0a6;--line:#2a3d34;--accent:#8fbfa5;--deep:#a3c1ad;--red:#e0466f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Serif TC",system-ui,sans-serif;line-height:1.6}
header{text-align:center;padding:28px 24px 26px;border-bottom:1px solid var(--line);max-width:1200px;margin:0 auto}
.crest{width:30px;height:30px;margin:0 auto 10px;border:1px solid var(--deep);display:grid;place-items:center;font:600 16px "Cormorant Garamond",serif;color:var(--deep)}
.eyebrow{letter-spacing:.32em;font-size:11px;text-transform:uppercase;color:var(--red)}
h1{font:500 clamp(26px,3.6vw,38px)/1.15 "Cormorant Garamond","Noto Serif TC",serif;margin:6px 0 6px;letter-spacing:.01em;background:linear-gradient(100deg,var(--deep) 30%,var(--accent) 45%,#fff 50%,var(--accent) 55%,var(--deep) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s linear infinite}
header p{color:var(--mute);max-width:560px;margin:0 auto;font-size:13px}
.rule{width:120px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--accent),#fff,var(--accent),transparent);background-size:200% 100%;animation:flow 3.5s linear infinite}
main{max-width:1200px;margin:0 auto;padding:36px 24px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:32px}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -22px rgba(20,38,31,.45);border-color:var(--accent)}
.frame{position:relative;aspect-ratio:16/10;overflow:hidden;background:#e9e5d8;border-bottom:1px solid var(--line);cursor:pointer}
.frame iframe{position:absolute;top:0;left:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none;background:#fff}
.frame::after{content:"Preview";position:absolute;inset:0;display:grid;place-items:center;background:rgba(29,74,58,.55);color:#fff;letter-spacing:.3em;font-size:12px;text-transform:uppercase;opacity:0;transition:.3s}
.frame:hover::after{opacity:1}
.body{padding:22px 24px 24px;display:flex;flex-direction:column;flex:1}
.no{font:italic 500 15px "Cormorant Garamond",serif;color:var(--red)}
h2{font:600 22px/1.3 "Cormorant Garamond","Noto Serif TC",serif;margin:2px 0 6px;color:var(--deep)}
.body p{margin:0 0 20px;color:var(--mute);font-size:14px;flex:1}
.row{display:flex;gap:16px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
a.go,button.pv{font:500 12px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--deep);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
a.go{margin-left:auto;border-bottom:1px solid var(--accent);padding-bottom:2px}
a.go:hover,button.pv:hover{color:var(--red)}
footer{text-align:center;padding:40px 24px 64px;color:var(--mute);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
dialog{width:min(1100px,94vw);height:88vh;padding:0;border:1px solid var(--line);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,16,.7)}
.bar{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line)}
.bar strong{font:600 18px "Cormorant Garamond","Noto Serif TC",serif;color:var(--deep);flex:1}
.bar button{font-size:22px;color:var(--ink)}
dialog iframe{width:100%;height:calc(100% - 50px);border:0;background:#fff}
.card::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 7s ease-in-out infinite;animation-delay:calc(var(--i)*.9s);mix-blend-mode:soft-light}
.card:hover::before{animation:sweep 1.4s ease-out infinite}
.card::after{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--accent),#fff,var(--accent),transparent);background-size:200% 100%;opacity:0;transition:opacity .3s;animation:flow 2.5s linear infinite;z-index:3}
.card:hover::after{opacity:1}
@keyframes sheen{to{background-position:-250% 0}}
@keyframes flow{to{background-position:-200% 0}}
@keyframes sweep{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
@media(max-width:420px){main{grid-template-columns:1fr;padding:40px 16px}}
</style>
</head>
<body>
<header>
  <div class="crest">S</div>
  <div class="eyebrow">Teacher Shirley · Learning Suite</div>
  <h1>Shirley Du's English Studio</h1>
  <p>英文學習與教學工具集 — 單字、寫作、測驗與月刊，盡在一頁。</p>
  <div class="rule"></div>
</header>
<main id="grid"></main>
<footer>© Shirley Du · English Learning Tools</footer>
<dialog id="dlg"><div class="bar"><strong id="dt"></strong><a class="go" id="dl" target="_blank" rel="noopener" style="margin:0">Open ↗</a><button class="pv" id="dx" aria-label="Close">×</button></div><iframe id="df" title="preview"></iframe></dialog>
<script>
const T=[
["Tr. Shirley Du 英文 Surely Do","英文學習與教學主平台，Surely Do 系列的入口。","https://shirley-du-app.vercel.app/"],
["Shirley's Vocab 單字綜合練習平台","多元題型的單字練習，系統化累積字彙實力。","https://ducj-creator.github.io/shirleyvocab.html#home"],
["iVocab for CHHS Teachers","忠信教師專用的單字管理與教學工具。","https://script.google.com/a/macros/chhs.hcc.edu.tw/s/AKfycbzgurpTFuXPlWlBhV9bJ8_E6aiGUTUUxIOifkv1abOLg6AgV39vZ5xWdtlv0tXL2XU9_g/exec"],
["CAP English 初三英文加油站","國三會考衝刺：題型演練與重點複習。","https://ducj-creator.github.io/Teacher-Shirley/tests/CAPGAS.html"],
["CHHS Monthly 忠信英文月刊","忠信師生的英文月刊，閱讀與活動精選。","https://ducj-creator.github.io/events/chhsmonthly/"],
["Hexagon Warrior 英文六邊形戰士","六大面向的英文能力挑戰，成為全能戰士。","https://ducj-creator.github.io/hexagonw.html"],
["Shirley's GSAT T&W 翻譯／寫作選修課","學測翻譯與寫作訓練，含 AI 輔助批改。","https://ducj-creator.github.io/Shirley-AI-Writing/gsattw.html"]];
const g=document.getElementById('grid');
T.forEach(([t,d,u],i)=>{
 const c=document.createElement('article');c.className='card';c.style.setProperty('--i',i);
 c.innerHTML=`<div class="frame"><iframe loading="lazy" tabindex="-1" title="${t}" src="${u}"></iframe></div>
 <div class="body"><span class="no">No. ${String(i+1).padStart(2,'0')}</span><h2>${t}</h2><p>${d}</p>
 <div class="row"><button class="pv">Preview</button><a class="go" href="${u}" target="_blank" rel="noopener">Open ↗</a></div></div>`;
 c.querySelector('.frame').onclick=c.querySelector('.pv').onclick=()=>openD(t,u);
 g.appendChild(c)});
function fit(){document.querySelectorAll('.frame').forEach(f=>{f.firstElementChild.style.transform=`scale(${f.clientWidth/1280})`})}
new ResizeObserver(fit).observe(document.body);fit();
const dlg=document.getElementById('dlg'),df=document.getElementById('df');
function openD(t,u){document.getElementById('dt').textContent=t;document.getElementById('dl').href=u;df.src=u;dlg.showModal()}
document.getElementById('dx').onclick=()=>dlg.close();
dlg.addEventListener('close',()=>df.src='about:blank');
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
</script>
</body>
</html>
